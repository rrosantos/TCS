<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venda de Ingressos - Sistema de Cinema</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="bi bi-camera-reels me-2"></i>
                Cinema System
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            <i class="bi bi-house me-1"></i>Início
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="cadastro-filmes.html">
                            <i class="bi bi-film me-1"></i>Filmes
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="cadastro-salas.html">
                            <i class="bi bi-building me-1"></i>Salas
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="cadastro-sessoes.html">
                            <i class="bi bi-clock me-1"></i>Sessões
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="venda-ingressos.html">
                            <i class="bi bi-ticket-perforated me-1"></i>Ingressos
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="sessoes.html">
                            <i class="bi bi-calendar3 me-1"></i>Programação
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row mb-4">
            <div class="col-12">
                <h2 class="text-success">
                    <i class="bi bi-ticket-perforated me-2"></i>
                    Venda de Ingressos
                </h2>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a href="index.html">Início</a></li>
                        <li class="breadcrumb-item active">Venda de Ingressos</li>
                    </ol>
                </nav>
            </div>
        </div>

        <div class="row justify-content-center">
            <div class="col-lg-8 mb-4">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">
                            <i class="bi bi-ticket-perforated me-2"></i>
                            Venda de Ingressos
                        </h5>
                    </div>
                    <div class="card-body">
                        <form id="vendaForm">
                            <div class="mb-3">
                                <label for="sessaoId" class="form-label required-field">Sessão</label>
                                <select class="form-select" id="sessaoId" required>
                                    <option value="">Selecione uma sessão</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="nomeCliente" class="form-label required-field">Nome do Cliente</label>
                                <input type="text" class="form-control" id="nomeCliente" 
                                    placeholder="Nome completo" maxlength="100" required>
                            </div>

                            <div class="mb-3">
                                <label for="cpfCliente" class="form-label required-field">CPF</label>
                                <input type="text" class="form-control" id="cpfCliente" 
                                    placeholder="000.000.000-00" maxlength="14" required>
                            </div>

                            <div class="mb-3">
                                <label for="assento" class="form-label required-field">Assento</label>
                                <input type="text" class="form-control" id="assento" 
                                    placeholder="A10" maxlength="10" required>
                                <div class="form-text">Exemplo: A10, B15, C05</div>
                            </div>

                            <div class="mb-3">
                                <label for="tipoPagamento" class="form-label required-field">Tipo de Pagamento</label>
                                <select class="form-select" id="tipoPagamento" required>
                                    <option value="">Selecione o tipo de pagamento</option>
                                    <option value="Cartao">Cartão</option>
                                    <option value="Pix">Pix</option>
                                    <option value="Dinheiro">Dinheiro</option>
                                </select>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-success btn-lg">
                                    <i class="bi bi-credit-card me-2"></i>
                                    Confirmar Venda
                                </button>
                                <button type="button" class="btn btn-secondary" onclick="limparFormulario()">
                                    <i class="bi bi-x-circle me-2"></i>
                                    Limpar Formulário
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-lg-4 mb-4">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h6 class="mb-0">
                            <i class="bi bi-clock-history me-2"></i>
                            Ingressos Vendidos
                        </h6>
                        <span class="badge bg-success" id="contadorIngressos">0</span>
                    </div>
                    <div class="card-body">
                        <div id="listaIngressos" style="max-height: 400px; overflow-y: auto;">
                            <!-- Lista de ingressos vendidos -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/cinema.js"></script>
    <script>
        // Variáveis globais
        let sessoes = [];
        let filmes = [];
        let salas = [];
        let ingressos = [];

        // Inicializar página
        document.addEventListener('DOMContentLoaded', function() {
            carregarDados();
            setupEventListeners();
        });

        function setupEventListeners() {
            document.getElementById('vendaForm').addEventListener('submit', finalizarVenda);
        }

        function carregarDados() {
            filmes = StorageManager.load('filmes');
            salas = StorageManager.load('salas');
            sessoes = StorageManager.load('sessoes');
            ingressos = StorageManager.load('ingressos');
            
            carregarSessoes();
            exibirIngressos();
        }

        function carregarSessoes() {
            const selectSessao = document.getElementById('sessaoId');
            
            // Filtrar apenas sessões futuras
            const hoje = new Date().toISOString().split('T')[0];
            const sessoesFuturas = sessoes.filter(sessao => sessao.data >= hoje);
            
            const opcoes = sessoesFuturas.map(sessao => {
                const filme = filmes.find(f => f.id === sessao.filmeId);
                const sala = salas.find(s => s.id === sessao.salaId);
                
                if (!filme || !sala) return '';
                
                return `<option value="${sessao.id}">
                    ${filme.titulo} - Sala ${sala.nome} - ${formatDate(sessao.data)} ${formatTime(sessao.horario)} - ${formatCurrency(sessao.preco)}
                </option>`;
            }).join('');
            
            selectSessao.innerHTML = '<option value="">Selecione uma sessão</option>' + opcoes;
        }

        function finalizarVenda(e) {
            e.preventDefault();
            
            const sessaoId = document.getElementById('sessaoId').value;
            const nomeCliente = document.getElementById('nomeCliente').value.trim();
            const cpfCliente = document.getElementById('cpfCliente').value.trim();
            const assento = document.getElementById('assento').value.trim();
            const tipoPagamento = document.getElementById('tipoPagamento').value;

            // Validações
            if (!sessaoId || !nomeCliente || !cpfCliente || !assento || !tipoPagamento) {
                alert('Todos os campos são obrigatórios!');
                return;
            }

            // Buscar dados da sessão
            const sessao = sessoes.find(s => s.id === sessaoId);
            const filme = filmes.find(f => f.id === sessao.filmeId);
            const sala = salas.find(s => s.id === sessao.salaId);

            // Criar novo ingresso
            const novoIngresso = {
                id: generateId(),
                sessaoId: sessaoId,
                nomeCliente: nomeCliente,
                cpfCliente: cpfCliente,
                assento: assento,
                tipoPagamento: tipoPagamento,
                preco: sessao.preco,
                dataVenda: new Date().toISOString(),
                // Dados adicionais para exibição
                filmeNome: filme.titulo,
                salaNome: sala.nome,
                sessaoData: sessao.data,
                sessaoHorario: sessao.horario
            };

            // Salvar no localStorage
            const ingressosExistentes = StorageManager.load('ingressos');
            ingressosExistentes.push(novoIngresso);
            StorageManager.save('ingressos', ingressosExistentes);

            // Atualizar contagem de ingressos vendidos na sessão
            const sessoesExistentes = StorageManager.load('sessoes');
            const sessaoIndex = sessoesExistentes.findIndex(s => s.id === sessaoId);
            if (sessaoIndex !== -1) {
                sessoesExistentes[sessaoIndex].ingressosVendidos = (sessoesExistentes[sessaoIndex].ingressosVendidos || 0) + 1;
                StorageManager.save('sessoes', sessoesExistentes);
            }

            // Mostrar confirmação e atualizar
            alert(`Ingresso vendido com sucesso!\nFilme: ${filme.titulo}\nCliente: ${nomeCliente}\nAssento: ${assento}`);
            
            limparFormulario();
            carregarDados();
        }

        function exibirIngressos() {
            const container = document.getElementById('listaIngressos');
            const contador = document.getElementById('contadorIngressos');
            
            contador.textContent = ingressos.length;
            
            if (ingressos.length === 0) {
                container.innerHTML = '<p class="text-muted small mb-0">Nenhum ingresso vendido</p>';
                return;
            }

            // Ordenar por data de venda (mais recentes primeiro)
            const ingressosOrdenados = [...ingressos].sort((a, b) => 
                new Date(b.dataVenda) - new Date(a.dataVenda)
            );

            container.innerHTML = ingressosOrdenados.map(ingresso => {
                const dataVenda = new Date(ingresso.dataVenda);
                
                return `
                    <div class="card mb-2">
                        <div class="card-body p-2">
                            <h6 class="mb-1">${ingresso.filmeNome}</h6>
                            <div class="small text-muted">
                                <strong>Cliente:</strong> ${ingresso.nomeCliente}<br>
                                <strong>Assento:</strong> ${ingresso.assento}<br>
                                <strong>Sala:</strong> ${ingresso.salaNome}<br>
                                <strong>Sessão:</strong> ${formatDate(ingresso.sessaoData)} ${formatTime(ingresso.sessaoHorario)}<br>
                                <strong>Pagamento:</strong> ${ingresso.tipoPagamento}<br>
                                <strong>Preço:</strong> ${formatCurrency(ingresso.preco)}<br>
                                <strong>Vendido em:</strong> ${dataVenda.toLocaleString('pt-BR')}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function limparFormulario() {
            document.getElementById('vendaForm').reset();
            document.getElementById('sessaoId').focus();
        }
    </script>
</body>
</html>
